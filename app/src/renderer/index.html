<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- No remote origins: everything is bundled, so nothing may be fetched at runtime. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" />
    <title>Hangar</title>
  </head>
  <body class="h-full">
    <!-- Empty until React draws: the window stays hidden until then, painted in the page's own
         colour (main.ts), and the loading window (splash.html) says what is happening meanwhile. -->
    <div id="root" class="h-full"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
